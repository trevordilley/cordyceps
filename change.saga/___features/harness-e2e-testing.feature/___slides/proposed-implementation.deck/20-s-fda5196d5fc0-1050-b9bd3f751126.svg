<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">The backend requests; the binary executes</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  06</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">The backend requests; the binary executes</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">A scripted file read still uses the actual tool implementation and operating system.</text><g id="router"><title>Mock provider</title><desc>Inspect incoming request Return read-file tool call Inspect follow-up result</desc><rect x="64" y="270" width="310" height="210" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="86" y="305.0" font-size="22" font-weight="600" fill="#105d53">Mock provider</text><text x="86" y="337.0" font-size="17" font-weight="400" fill="#45576b">Inspect incoming request</text><text x="86" y="360.8" font-size="17" font-weight="400" fill="#45576b">Return read-file tool call</text><text x="86" y="384.6" font-size="17" font-weight="400" fill="#45576b">Inspect follow-up result</text></g><g id="harness"><title>Real AI harness</title><desc>Parse provider response Apply normal permissions Execute the built-in tool</desc><rect x="485" y="270" width="310" height="210" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="507" y="305.0" font-size="22" font-weight="600" fill="#23364b">Real AI harness</text><text x="507" y="337.0" font-size="17" font-weight="400" fill="#45576b">Parse provider response</text><text x="507" y="360.8" font-size="17" font-weight="400" fill="#45576b">Apply normal permissions</text><text x="507" y="384.6" font-size="17" font-weight="400" fill="#45576b">Execute the built-in tool</text></g><g id="filesystem"><title>Fixture filesystem</title><desc>Actual test file Actual access permissions Actual read result</desc><rect x="906" y="270" width="310" height="210" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="928" y="305.0" font-size="22" font-weight="600" fill="#23364b">Fixture filesystem</text><text x="928" y="337.0" font-size="17" font-weight="400" fill="#45576b">Actual test file</text><text x="928" y="360.8" font-size="17" font-weight="400" fill="#45576b">Actual access permissions</text><text x="928" y="384.6" font-size="17" font-weight="400" fill="#45576b">Actual read result</text></g><g id="request"><title>1  Request / follow-up</title><desc>The binary sends a provider request, then later sends another request containing its actual tool result.</desc><rect x="369" y="295" width="121" height="10" fill="transparent"/><path d="M485,300 L374,300" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="362" y="221.0" font-size="15" font-weight="400" fill="#45576b">1  Request / follow-up</text></g><g id="tool-call"><title>2  Tool call</title><desc>The test returns the provider-specific tool name and arguments for the supported harness version.</desc><rect x="369" y="420" width="121" height="10" fill="transparent"/><path d="M374,425 L485,425" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="374" y="454.0" font-size="15" font-weight="400" fill="#45576b">2  Tool call</text></g><g id="file-read"><title>3  Read</title><desc>3  Read</desc><rect x="790" y="295" width="121" height="10" fill="transparent"/><path d="M795,300 L906,300" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="813" y="277.0" font-size="15" font-weight="400" fill="#45576b">3  Read</text></g><g id="file-result"><title>4  Result</title><desc>4  Result</desc><rect x="790" y="420" width="121" height="10" fill="transparent"/><path d="M906,425 L795,425" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="807" y="454.0" font-size="15" font-weight="400" fill="#45576b">4  Result</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb"/><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">06 / 13</text></g></svg>