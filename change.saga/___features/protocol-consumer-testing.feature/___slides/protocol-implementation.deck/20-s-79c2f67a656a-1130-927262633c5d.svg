<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Consumer scenarios versus library checks</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 14</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Consumer scenarios versus library checks</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">ACP scenarios exercise the consumer; Cordyceps does not certify harness versions or platforms.</text><g id="proof-0"><title>Launch mechanics</title><desc>Earlier exploratory experiments. Historical; no shell-support obligation.</desc><rect x="48" y="164" width="1184" height="66" rx="8" fill="#e0f4f0" /><text x="65" y="188.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">Launch mechanics</text><text x="437" y="188.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Earlier exploratory experiments</text><text x="838" y="188.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Historical; no shell-support obligation</text></g><g id="proof-1"><title>Codex model route</title><desc>Real CLI + local Responses mock. Historical text exchange; not ACP.</desc><rect x="48" y="241" width="1184" height="66" rx="8" fill="#e0f4f0" /><text x="65" y="265.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">Codex model route</text><text x="437" y="265.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Real CLI + local Responses mock</text><text x="838" y="265.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Historical text exchange; not ACP</text></g><g id="proof-2"><title>ACP handshake / sessions</title><desc>Consumer’s real adapter and client. Consumer scenario; no run claimed.</desc><rect x="48" y="318" width="1184" height="66" rx="8" fill="#f2f5f8" /><text x="65" y="342.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">ACP handshake / sessions</text><text x="437" y="342.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer’s real adapter and client</text><text x="838" y="342.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer scenario; no run claimed</text></g><g id="proof-3"><title>Messages / tools / cancellation</title><desc>Consumer client + scripted provider. Consumer scenario; timing and callbacks unverified.</desc><rect x="48" y="395" width="1184" height="66" rx="8" fill="#f2f5f8" /><text x="65" y="419.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">Messages / tools / cancellation</text><text x="437" y="419.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer client + scripted provider</text><text x="838" y="419.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer scenario; timing and callbacks</text><text x="838" y="441.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">unverified</text></g><g id="proof-4"><title>Load / resume / close / modes</title><desc>Consumer tests negotiated features only when relevant. Consumer-owned optional coverage; no library compatibility matrix.</desc><rect x="48" y="472" width="1184" height="66" rx="8" fill="#f2f5f8" /><text x="65" y="496.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">Load / resume / close / modes</text><text x="437" y="496.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer tests negotiated features</text><text x="437" y="518.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">only when relevant</text><text x="838" y="496.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer-owned optional coverage;</text><text x="838" y="518.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">no library compatibility matrix</text></g><g id="proof-5"><title>Malformed / arbitrary ACP frames</title><desc>Explicit mock peer or fault injector. Separate capability; not implemented.</desc><rect x="48" y="549" width="1184" height="66" rx="8" fill="#f2f5f8" /><text x="65" y="573.0" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#105d53" xml:space="preserve">Malformed / arbitrary ACP frames</text><text x="437" y="573.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Explicit mock peer or fault injector</text><text x="838" y="573.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Separate capability; not</text><text x="838" y="595.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">implemented</text></g><a href="https://agentclientprotocol.com/protocol/v1/prompt-turn" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / prompt-turn</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed design + illustrative tests · ACP v1 examples · no ACP integration verified yet</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">14 / 14</text></svg>