<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Test the library’s own behavior</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 11</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Test the library’s own behavior</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">These checks use definitions, in-memory values, temp files and synthetic provider requests.</text><g id="row-0"><title>Bad definition</title><desc>Unknown token, missing input or absent recipe Assert field-level diagnostics; no binary probes</desc><rect x="48" y="165" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="190.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Bad definition</text><text x="315" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Unknown token, missing input or absent</text><text x="315" y="212.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">recipe</text><text x="766" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Assert field-level diagnostics; no binary</text><text x="766" y="212.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">probes</text></g><g id="row-1"><title>Environment merge</title><desc>Base env + removals + generated endpoint Assert output values and unchanged input</desc><rect x="48" y="249" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="274.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Environment merge</text><text x="315" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Base env + removals + generated endpoint</text><text x="766" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Assert output values and unchanged input</text></g><g id="row-2"><title>Config rendering</title><desc>JSON/TOML values with paths and quoting Assert serialized file and generated references</desc><rect x="48" y="333" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="358.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Config rendering</text><text x="315" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">JSON/TOML values with paths and quoting</text><text x="766" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Assert serialized file and generated</text><text x="766" y="380.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">references</text></g><g id="row-3"><title>Cleanup failure path</title><desc>Fail file write after backend allocation Assert listener closes and owned files vanish</desc><rect x="48" y="417" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="442.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Cleanup failure path</text><text x="315" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Fail file write after backend allocation</text><text x="766" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Assert listener closes and owned files</text><text x="766" y="464.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">vanish</text></g><g id="row-4"><title>Concurrent mocks</title><desc>Two synthetic requests with different replies Assert isolation; aborting one spares the other</desc><rect x="48" y="501" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="526.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Concurrent mocks</text><text x="315" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Two synthetic requests with different</text><text x="315" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">replies</text><text x="766" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Assert isolation; aborting one spares the</text><text x="766" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">other</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed implementation · illustrative APIs and fictional harness settings · not delivered</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">11 / 13</text></svg>