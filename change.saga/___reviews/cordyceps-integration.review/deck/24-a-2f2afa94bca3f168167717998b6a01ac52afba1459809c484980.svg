<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">One backend; consumer-owned execution</title>
  <desc id="diagram-desc">ESM core and an optional Playwright fixture prepare provider controls; applications keep executable and ACP ownership.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-pack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-exports" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-wraps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-inject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(50 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">One backend; consumer-owned execution</tspan></text>
  </g>
  <g id="build" data-diagram-kind="node" transform="translate(60 130)" role="group" aria-label="Bun build + strict tsc">
    <rect width="300" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Bun build + strict tsc</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">Development tooling</tspan></text>
  </g>
  <g id="package" data-diagram-kind="node" transform="translate(490 130)" role="group" aria-label="npm artifact">
    <path d="M0 0H290V92C193.333 64.29 96.667 119.71 0 92Z" stroke-linejoin="round" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="145" y="37.875" font-size="22" fill="#153869" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="145" y="37.875">npm artifact</tspan></text>
    <text x="145" y="64.375" font-size="15" fill="#153869" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="145" y="64.375">Node JS + types + definitions</tspan></text>
  </g>
  <g id="core" data-diagram-kind="node" transform="translate(150 330)" role="group" aria-label="cordyceps">
    <rect width="300" height="110" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">cordyceps</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="73">Standalone prepare / dispose</tspan></text>
  </g>
  <g id="fixture" data-diagram-kind="node" transform="translate(810 130)" role="group" aria-label="cordyceps/playwright">
    <rect width="390" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">cordyceps/playwright</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">External optional peer</tspan></text>
  </g>
  <g id="consumer" data-diagram-kind="node" transform="translate(810 430)" role="group" aria-label="Consumer application">
    <circle cx="195" cy="15.3" r="14.28" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <path d="M195 29.58V63.24M170.52 42.84H219.48M195 63.24L174.6 99.96M195 63.24L215.4 99.96" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" style="stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="195" y="130" font-size="22" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="195" y="130">Consumer application</tspan></text>
    <text x="195" y="156.5" font-size="15" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="195" y="156.5">Own binary, client and tools</tspan></text>
  </g>
  <g id="pack" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="build to package" data-from="build" data-to="package">
    <path d="M360 180 L490 180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-pack)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="exports" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="package to core" data-from="package" data-to="core">
    <path d="M540 230 L300 330" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-exports)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="wraps" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="same core" data-from="fixture" data-to="core">
    <path d="M1000 230 L1000 285 L450 375" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-wraps)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="690" y="278" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="690" y="278">same core</tspan></text>
  </g>
  <g id="inject" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="env / args / files" data-from="core" data-to="consumer">
    <path d="M450 400 L810 500" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-inject)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="500" y="433" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="500" y="433">env / args / files</tspan></text>
  </g>
</svg>
