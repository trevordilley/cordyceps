<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>One prompt request spans the whole turn</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 06</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">One prompt request spans the whole turn</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Message notifications and tool activity occur while the original session/prompt is still pending.</text><g id="idle"><title>Session ready</title><desc>No active prompt Existing conversation retained</desc><rect x="48" y="245" width="280" height="150" rx="12" fill="#f2f5f8" stroke="#a9c3ca"/><text x="68" y="277.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Session ready</text><text x="68" y="310.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">No active prompt</text><text x="68" y="334.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Existing conversation retained</text></g><g id="active"><title>Prompt outstanding</title><desc>Model request → text updates Optional tools + permissions Further model requests may follow</desc><rect x="460" y="215" width="360" height="210" rx="12" fill="#e0f4f0" stroke="#a9c3ca"/><text x="480" y="247.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Prompt outstanding</text><text x="480" y="280.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Model request → text updates</text><text x="480" y="304.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Optional tools + permissions</text><text x="480" y="328.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Further model requests may follow</text></g><g id="settled"><title>Prompt resolved</title><desc>stopReason: end_turn or stopReason: cancelled Connection can remain open</desc><rect x="952" y="245" width="280" height="170" rx="12" fill="#f2f5f8" stroke="#a9c3ca"/><text x="972" y="277.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Prompt resolved</text><text x="972" y="310.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">stopReason: end_turn</text><text x="972" y="334.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">or stopReason: cancelled</text><text x="972" y="358.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Connection can remain open</text></g><g id="start"><title>session/prompt</title><desc>session/prompt is a distinct transition in the client turn lifecycle.</desc><path d="M328 320 L460 320" fill="none" stroke="#6b8097" stroke-width="2.5"/><text x="333" y="298.0" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#45576b" xml:space="preserve">session/prompt</text><polygon points="460,320 447,313 447,327" fill="#6b8097"/></g><g id="finish"><title>normal completion</title><desc>normal completion is a distinct transition in the client turn lifecycle.</desc><path d="M820 280 L952 280" fill="none" stroke="#6b8097" stroke-width="2.5"/><text x="813" y="254.0" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#45576b" xml:space="preserve">normal completion</text><polygon points="952,280 939,273 939,287" fill="#6b8097"/></g><g id="cancel"><title>cancel → drain → cancelled</title><desc>cancel → drain → cancelled is a distinct transition in the client turn lifecycle.</desc><path d="M640 425 L640 493 L1092 493 L1092 415" fill="none" stroke="#6b8097" stroke-width="2.5"/><text x="741" y="480.0" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#45576b" xml:space="preserve">cancel → drain → cancelled</text><polygon points="1092,415 1085,428 1099,428" fill="#6b8097"/></g><g id="not-process"><title>Completion is a protocol boundary</title><desc>A completed tool can lead to another model request in the same turn. Do not close the session on a text chunk, a tool result, or a cancel click.</desc><rect x="48" y="535" width="1184" height="105" rx="12" fill="#e0f4f0" stroke="#a9c3ca"/><text x="68" y="567.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Completion is a protocol boundary</text><text x="68" y="600.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">A completed tool can lead to another model request in the same turn.</text><text x="68" y="624.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Do not close the session on a text chunk, a tool result, or a cancel click.</text></g><a href="https://agentclientprotocol.com/protocol/v1/prompt-turn" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / prompt-turn</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed design + illustrative tests · ACP v1 examples · no ACP integration verified yet</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">06 / 14</text></svg>