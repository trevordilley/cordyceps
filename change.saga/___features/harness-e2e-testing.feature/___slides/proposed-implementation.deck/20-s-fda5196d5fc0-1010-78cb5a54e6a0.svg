<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Configure the app before it starts</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097" /></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097" /></marker></defs><rect width="1280" height="720" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  02</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Configure the app before it starts</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">Existing application code continues to discover and invoke its installed AI binary.</text><g id="prepare"><title>1  Prepare session</title><desc>Start mock backend Render injection settings Prepare isolated config</desc><rect x="64" y="220" width="260" height="180" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5" /><text x="86" y="255.0" font-size="22" font-weight="600" fill="#105d53">1  Prepare session</text><text x="86" y="287.0" font-size="17" font-weight="400" fill="#45576b">Start mock backend</text><text x="86" y="310.8" font-size="17" font-weight="400" fill="#45576b">Render injection settings</text><text x="86" y="334.6" font-size="17" font-weight="400" fill="#45576b">Prepare isolated config</text></g><g id="app"><title>2  Launch app</title><desc>Apply injection settings Then run normal app logic Discovery stays in the app</desc><rect x="360" y="220" width="260" height="180" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="382" y="255.0" font-size="22" font-weight="600" fill="#23364b">2  Launch app</text><text x="382" y="287.0" font-size="17" font-weight="400" fill="#45576b">Apply injection settings</text><text x="382" y="310.8" font-size="17" font-weight="400" fill="#45576b">Then run normal app logic</text><text x="382" y="334.6" font-size="17" font-weight="400" fill="#45576b">Discovery stays in the app</text></g><g id="binary"><title>3  Real binary</title><desc>Use selected mode + flags Keep real OS behavior Produce normal output</desc><rect x="656" y="220" width="260" height="180" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="678" y="255.0" font-size="22" font-weight="600" fill="#23364b">3  Real binary</text><text x="678" y="287.0" font-size="17" font-weight="400" fill="#45576b">Use selected mode + flags</text><text x="678" y="310.8" font-size="17" font-weight="400" fill="#45576b">Keep real OS behavior</text><text x="678" y="334.6" font-size="17" font-weight="400" fill="#45576b">Produce normal output</text></g><g id="backend"><title>4  Mock provider</title><desc>Observe model requests Invoke test handlers Return chosen responses</desc><rect x="952" y="220" width="264" height="180" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5" /><text x="974" y="255.0" font-size="22" font-weight="600" fill="#105d53">4  Mock provider</text><text x="974" y="287.0" font-size="17" font-weight="400" fill="#45576b">Observe model requests</text><text x="974" y="310.8" font-size="17" font-weight="400" fill="#45576b">Invoke test handlers</text><text x="974" y="334.6" font-size="17" font-weight="400" fill="#45576b">Return chosen responses</text></g><g id="app-env"><title>launch env</title><desc>Pass the prepared environment into the application launch before any child shell or executable cache is created.</desc><rect x="319" y="305" width="46" height="10" fill="transparent" /><path d="M324,310 L360,310" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" /></g><g id="discovery"><title>discover + launch</title><desc>The consuming application keeps its existing command lookup and process launch code.</desc><rect x="615" y="305" width="46" height="10" fill="transparent" /><path d="M620,310 L656,310" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" /></g><g id="provider"><title>provider protocol</title><desc>The real harness makes provider API requests to the mock backend.</desc><rect x="911" y="305" width="46" height="10" fill="transparent" /><path d="M916,310 L952,310" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" /></g><g id="process-boundary"><title>Process-tree isolation</title><desc>Already-running apps, cached shells and remote hosts require configuration at their own launch boundary.</desc><text x="64" y="480.0" font-size="23" font-weight="600" fill="#805616">The isolation boundary is the application process tree, not an async test callback.</text><text x="64" y="520.0" font-size="18" font-weight="400" fill="#45576b">Already-running apps, cached shells and remote hosts require configuration at their own launch boundary.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb" /><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">02 / 13</text></g></svg>