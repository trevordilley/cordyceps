<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Provider codecs implement the mock API</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 09</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Provider codecs implement the mock API</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">The reusable code sits at the provider HTTP boundary, independent of the binary that sends a request.</text><g id="codec"><title>PROPOSED TYPESCRIPT CONTRACT</title><desc>Proposed internal Cordyceps types: ProviderAdapter and the named HTTP/request/event types; no SDK imports. Proposed example; not implemented.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">PROPOSED TYPESCRIPT CONTRACT</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">interface ProviderAdapter {</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  id: string;</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  routes: readonly HttpRouteSpec[];</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  decode(request: RawHttpRequest,</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    signal: AbortSignal): Promise&lt;CapturedRequest&gt;;</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  respond(request: CapturedRequest,</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    events: AsyncIterable&lt;ProviderEvent&gt;,</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    response: HttpResponseSink,</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    signal: AbortSignal): Promise&lt;void&gt;;</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">}</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Preserve raw traffic beside normalized observations.</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Encode text, tool calls, streams and scripted errors.</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Honor backpressure, disconnects and cancellation.</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Test this contract with synthetic HTTP fixtures.</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// No installed harness is needed for codec tests.</text></g><g id="raw"><title>Observe provider traffic</title><desc>Retain actual tool schemas and provider IDs. Do not infer ACP session state from HTTP traffic; consumer instrumentation observes its ACP client.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Observe provider traffic</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Retain actual tool schemas and provider</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">IDs. Do not infer ACP session state from</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">HTTP traffic; consumer instrumentation</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">observes its ACP client.</text></g><g id="errors"><title>Keep test failures visible</title><desc>A route assertion failure is a consumer-test failure. A deliberately scripted provider error is a response for the app to handle.</desc><text x="842" y="344.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Keep test failures visible</text><text x="842" y="379.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">A route assertion failure is a consumer-</text><text x="842" y="403.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">test failure. A deliberately scripted</text><text x="842" y="427.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">provider error is a response for the app</text><text x="842" y="451.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">to handle.</text></g><g id="extensions"><title>Two contribution shapes</title><desc>Existing provider API: add JSON. New provider wire protocol: add a codec. Neither requires a Cordyceps harness runner or binary support policy.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Two contribution shapes</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Existing provider API: add JSON. New</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">provider wire protocol: add a codec.</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Neither requires a Cordyceps harness</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">runner or binary support policy.</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Proposed internal Cordyceps types: ProviderAdapter and the named HTTP/request/event types; no SDK imports.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">09 / 13</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Platform/language types: AbortSignal, Promise, AsyncIterable. This interface is a design sketch, not delivered.</text></svg>