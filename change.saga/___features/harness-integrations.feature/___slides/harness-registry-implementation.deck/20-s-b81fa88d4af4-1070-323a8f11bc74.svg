<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Own only mock-backend resources</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 08</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Own only mock-backend resources</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">No preparation state resolves, probes or starts a harness process.</text><g id="row-0"><title>Validate data</title><desc>Select definition, mode and required inputs No executable or shell interaction</desc><rect x="48" y="165" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="190.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Validate data</text><text x="315" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Select definition, mode and required inputs</text><text x="766" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">No executable or shell interaction</text></g><g id="row-1"><title>Allocate mock</title><desc>Start listener; create owned config directory Track acquired resources for rollback</desc><rect x="48" y="249" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="274.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Allocate mock</text><text x="315" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Start listener; create owned config</text><text x="315" y="296.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">directory</text><text x="766" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Track acquired resources for rollback</text></g><g id="row-2"><title>Render injection</title><desc>Substitute values; serialize optional config On failure, close listener and remove owned files</desc><rect x="48" y="333" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="358.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Render injection</text><text x="315" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Substitute values; serialize optional</text><text x="315" y="380.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">config</text><text x="766" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">On failure, close listener and remove owned</text><text x="766" y="380.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">files</text></g><g id="row-3"><title>Use mock</title><desc>App launches normally and sends provider requests Consumer drives its own application test</desc><rect x="48" y="417" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="442.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Use mock</text><text x="315" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">App launches normally and sends provider</text><text x="315" y="464.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">requests</text><text x="766" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer drives its own application test</text></g><g id="row-4"><title>Dispose mock</title><desc>Abort held routes; close backend; remove files Idempotent; never discover or kill app processes</desc><rect x="48" y="501" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="526.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Dispose mock</text><text x="315" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Abort held routes; close backend; remove</text><text x="315" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">files</text><text x="766" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Idempotent; never discover or kill app</text><text x="766" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">processes</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed implementation · illustrative APIs and fictional harness settings · not delivered</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">08 / 13</text></svg>