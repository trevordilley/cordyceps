<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Playwright: drive the frontend, control the reply</title><rect width="1280" height="720" fill="white" /><text x="48" y="35" font-family="Arial" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / PROPOSED USAGE / 10</text><text x="48" y="81" font-family="Arial" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Playwright: drive the frontend, control the reply</text><text x="48" y="114" font-family="Arial" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Example Electron app: normal UI input reaches the real harness and renders its output.</text><g id="sample"><title>Proposed code sample</title><rect x="48" y="143" width="835" height="505" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="169" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { test, expect } from './fixtures';</text><text x="66" y="189" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { _electron as electron } from 'playwright';</text><text x="66" y="209" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="229" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">test('renders a controlled reply', async ({ ai }) =&gt; {</text><text x="66" y="249" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  await ai.route(() =&gt; true, route =&gt;</text><text x="66" y="269" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    route.fulfill({ text: 'Hello from the test' }));</text><text x="66" y="289" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  const app = await electron.launch({</text><text x="66" y="309" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    args: ['./app/main.js'], env: ai.environment(process.env),</text><text x="66" y="329" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  });</text><text x="66" y="349" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  try {</text><text x="66" y="369" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    const page = await app.firstWindow();</text><text x="66" y="389" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    await page.getByRole('textbox').fill('Say hello');</text><text x="66" y="409" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    const [request] = await Promise.all([</text><text x="66" y="429" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      ai.waitForRequest(r =&gt; r.text.includes('Say hello'),</text><text x="66" y="449" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">        { timeout: 5_000 }),</text><text x="66" y="469" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      page.getByRole('button', { name: 'Send' }).click(),</text><text x="66" y="489" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    ]);</text><text x="66" y="509" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    expect(request.raw.body).toBeDefined();</text><text x="66" y="529" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    await expect(page.getByTestId('assistant-message'))</text><text x="66" y="549" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      .toHaveText('Hello from the test');</text><text x="66" y="569" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  } finally {</text><text x="66" y="589" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    await app.close();</text><text x="66" y="609" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }</text><text x="66" y="629" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><desc>Cordyceps (proposed): ai + route. Playwright: electron, page, expect. Yours: ./fixtures, app path and locators. Proposed example; not implemented.</desc></g><g id="note-0"><text x="913" y="164" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Register before launch</text><text x="913" y="194" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">The handler is ready before</text><text x="913" y="217" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">the app can send requests.</text><text x="913" y="240" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">This example answers all.</text></g><g id="note-1"><text x="913" y="319" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Two observations</text><text x="913" y="349" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">request.text is a proposed</text><text x="913" y="372" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">parsed view; raw.body keeps</text><text x="913" y="395" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">the provider request body.</text></g><g id="note-2"><text x="913" y="474" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Consumer-owned cleanup</text><text x="913" y="504" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Close the app and its children</text><text x="913" y="527" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">before fixture teardown.</text><text x="913" y="550" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">App path and locators vary.</text></g><text x="48" y="687" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): ai + route. Playwright: electron, page, expect. Yours: ./fixtures, app path and locators.</text><text x="1160" y="689" font-family="Arial" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">10 / 13</text><text x="48" y="705" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">app is Playwright’s ElectronApplication here; no custom app launcher. Illustrative test; not executed.</text></svg>