<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Turn provider traffic into test controls</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  05</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Turn provider traffic into test controls</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">Keep wire compatibility in adapters and scenario behavior in the session core.</text><g id="capture"><title>Capture request</title><desc>Raw body + headers Session and request identity Timestamp + parsed view</desc><rect x="64" y="225" width="255" height="190" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="86" y="260.0" font-size="22" font-weight="600" fill="#23364b">Capture request</text><text x="86" y="292.0" font-size="17" font-weight="400" fill="#45576b">Raw body + headers</text><text x="86" y="315.8" font-size="17" font-weight="400" fill="#45576b">Session and request identity</text><text x="86" y="339.6" font-size="17" font-weight="400" fill="#45576b">Timestamp + parsed view</text></g><g id="match"><title>Select handler</title><desc>Match request predicates Await consumer callback Record handler outcome</desc><rect x="363" y="225" width="255" height="190" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="385" y="260.0" font-size="22" font-weight="600" fill="#105d53">Select handler</text><text x="385" y="292.0" font-size="17" font-weight="400" fill="#45576b">Match request predicates</text><text x="385" y="315.8" font-size="17" font-weight="400" fill="#45576b">Await consumer callback</text><text x="385" y="339.6" font-size="17" font-weight="400" fill="#45576b">Record handler outcome</text></g><g id="encode"><title>Encode response</title><desc>Text or tool-call semantics Provider-specific format Streaming where supported</desc><rect x="662" y="225" width="255" height="190" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="684" y="260.0" font-size="22" font-weight="600" fill="#23364b">Encode response</text><text x="684" y="292.0" font-size="17" font-weight="400" fill="#45576b">Text or tool-call semantics</text><text x="684" y="315.8" font-size="17" font-weight="400" fill="#45576b">Provider-specific format</text><text x="684" y="339.6" font-size="17" font-weight="400" fill="#45576b">Streaming where supported</text></g><g id="deliver"><title>Deliver + observe</title><desc>Send to real binary Record response / failure Resolve waiting assertions</desc><rect x="961" y="225" width="255" height="190" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="983" y="260.0" font-size="22" font-weight="600" fill="#105d53">Deliver + observe</text><text x="983" y="292.0" font-size="17" font-weight="400" fill="#45576b">Send to real binary</text><text x="983" y="315.8" font-size="17" font-weight="400" fill="#45576b">Record response / failure</text><text x="983" y="339.6" font-size="17" font-weight="400" fill="#45576b">Resolve waiting assertions</text></g><g id="capture-match"><title>match</title><desc>match</desc><rect x="314" y="315" width="54" height="10" fill="transparent"/><path d="M319,320 L363,320" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/></g><g id="match-encode"><title>fulfill</title><desc>fulfill</desc><rect x="613" y="315" width="54" height="10" fill="transparent"/><path d="M618,320 L662,320" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/></g><g id="encode-deliver"><title>respond</title><desc>respond</desc><rect x="912" y="315" width="54" height="10" fill="transparent"/><path d="M917,320 L961,320" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/></g><g id="routing-decisions"><title>Routing decisions to confirm</title><desc>Proposed default: unmatched requests fail visibly. Handler precedence, retry semantics, raw responses and streaming controls remain open.</desc><text x="64" y="490.0" font-size="21" font-weight="600" fill="#805616">Proposed default: unmatched requests fail visibly; no automatic live-provider fallback.</text><text x="64" y="530.0" font-size="18" font-weight="400" fill="#45576b">To decide: handler precedence, retry semantics, raw-response escape hatch, and streaming controls.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb"/><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">05 / 13</text></g></svg>