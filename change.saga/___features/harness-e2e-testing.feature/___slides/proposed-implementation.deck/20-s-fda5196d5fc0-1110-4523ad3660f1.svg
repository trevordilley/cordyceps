<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Script a tool call; inspect the real result</title><rect width="1280" height="720" fill="white" /><text x="48" y="35" font-family="Arial" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / PROPOSED USAGE / 12</text><text x="48" y="81" font-family="Arial" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Script a tool call; inspect the real result</text><text x="48" y="114" font-family="Arial" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Replace the text handler in either example with a two-turn file-read scenario.</text><g id="sample"><title>Proposed code sample</title><rect x="48" y="143" width="835" height="505" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="169" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Before launching: create a fixture file at fixturePath.</text><text x="66" y="189" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// ai is the same session as in the preceding examples.</text><text x="66" y="209" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await ai.route(() =&gt; true, async route =&gt; {</text><text x="66" y="229" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  const result = route.request.toolResults.find(</text><text x="66" y="249" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    r =&gt; r.id === 'read-fixture');</text><text x="66" y="269" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  if (result) {</text><text x="66" y="289" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    if (result.isError || !result.text.includes('fixture contents')) {</text><text x="66" y="309" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      throw new Error('Expected the real file contents');</text><text x="66" y="329" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    }</text><text x="66" y="349" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    return route.fulfill({ text: 'File read verified' });</text><text x="66" y="369" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }</text><text x="66" y="389" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  if (!route.request.tools.some(t =&gt; t.name === 'Read')) {</text><text x="66" y="409" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    throw new Error('This harness did not offer the Read tool');</text><text x="66" y="429" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }</text><text x="66" y="449" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  return route.fulfill({ toolCall: {</text><text x="66" y="469" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    id: 'read-fixture', name: 'Read',</text><text x="66" y="489" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    input: { file_path: fixturePath },</text><text x="66" y="509" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  } });</text><text x="66" y="529" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="549" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Drive the app (or CLI) to request this file read.</text><text x="66" y="569" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Assert the output includes "File read verified".</text><text x="66" y="589" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Keep a timeout around the complete scenario.</text><desc>Cordyceps (proposed): ai + route + toolResults. Yours: fixturePath, file setup, app drive and assertions. Proposed example; not implemented.</desc></g><g id="note-0"><text x="913" y="164" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Provider semantics</text><text x="913" y="194" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">fulfill encodes a tool-call</text><text x="913" y="217" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">response for the adapter.</text><text x="913" y="240" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">The binary executes the read.</text></g><g id="note-1"><text x="913" y="319" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Real permissions apply</text><text x="913" y="349" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Use a disposable fixture file.</text><text x="913" y="372" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Grant normal test permissions</text><text x="913" y="395" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">or drive the permission prompt.</text></g><g id="note-2"><text x="913" y="474" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Adapter contract to prove</text><text x="913" y="504" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">tools / toolResults are proposed</text><text x="913" y="527" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">parsed views. Read + file_path</text><text x="913" y="550" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">depend on harness version.</text></g><text x="48" y="687" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): ai + route + toolResults. Yours: fixturePath, file setup, app drive and assertions.</text><text x="1160" y="689" font-family="Arial" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">12 / 13</text><text x="48" y="705" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Read / file_path belong to the real harness’s tool schema. Illustrative provider scenario; not executed.</text></svg>