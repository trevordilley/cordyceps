<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Your client consumes native ACP</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  01</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Your client consumes native ACP</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">The selected real agent or adapter speaks the negotiated ACP version and capabilities.</text><g id="consumer"><title>Consumer under test</title><desc>Existing ACP client + types Session state + client handlers Assertions on protocol behavior</desc><rect x="64" y="220" width="310" height="200" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="86" y="255.0" font-size="22" font-weight="600" fill="#105d53">Consumer under test</text><text x="86" y="287.0" font-size="17" font-weight="400" fill="#45576b">Existing ACP client + types</text><text x="86" y="310.8" font-size="17" font-weight="400" fill="#45576b">Session state + client handlers</text><text x="86" y="334.6" font-size="17" font-weight="400" fill="#45576b">Assertions on protocol behavior</text></g><g id="agent"><title>Real agent / adapter</title><desc>Configured for ACP invocation Handles real model responses Emits its actual ACP messages</desc><rect x="485" y="220" width="310" height="200" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="507" y="255.0" font-size="22" font-weight="600" fill="#23364b">Real agent / adapter</text><text x="507" y="287.0" font-size="17" font-weight="400" fill="#45576b">Configured for ACP invocation</text><text x="507" y="310.8" font-size="17" font-weight="400" fill="#45576b">Handles real model responses</text><text x="507" y="334.6" font-size="17" font-weight="400" fill="#45576b">Emits its actual ACP messages</text></g><g id="provider"><title>Cordyceps provider</title><desc>Capture model API requests Prescribe text and tool calls Encode provider wire format</desc><rect x="906" y="220" width="310" height="200" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="928" y="255.0" font-size="22" font-weight="600" fill="#105d53">Cordyceps provider</text><text x="928" y="287.0" font-size="17" font-weight="400" fill="#45576b">Capture model API requests</text><text x="928" y="310.8" font-size="17" font-weight="400" fill="#45576b">Prescribe text and tool calls</text><text x="928" y="334.6" font-size="17" font-weight="400" fill="#45576b">Encode provider wire format</text></g><g id="acp"><title>ACP</title><desc>Native ACP requests, responses and notifications pass between the consumer and the real agent or adapter.</desc><rect x="369" y="315" width="121" height="10" fill="transparent"/><path d="M374,320 L485,320" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="406" y="300.0" font-size="15" font-weight="400" fill="#45576b">ACP</text></g><g id="model"><title>Model API</title><desc>Provider traffic is a separate protocol; the real agent converts model responses into its own ACP behavior.</desc><rect x="790" y="315" width="121" height="10" fill="transparent"/><path d="M795,320 L906,320" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="808" y="300.0" font-size="15" font-weight="400" fill="#45576b">Model API</text></g><g id="native-payload"><title>Preserve the original ACP payload</title><desc>Keep identifiers, methods, params, results, errors and extensions when present. Observer metadata stays separate.</desc><rect x="64" y="465" width="1152" height="92" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="86" y="500.0" font-size="22" font-weight="600" fill="#105d53">Preserve the original ACP payload</text><text x="86" y="532.0" font-size="17" font-weight="400" fill="#45576b">Keep identifiers, methods, params, results, errors and extensions when present. Observer metadata stays separate.</text></g><g id="real-behavior"><title>Provider control does not synthesize arbitrary ACP messages</title><desc>Negotiate and exercise the real lifecycle. A directly scripted ACP peer would be a separate capability.</desc><rect x="64" y="575" width="1152" height="77" rx="14" fill="#fff2d6" stroke="#d49d3e" stroke-width="1.5"/><text x="86" y="610.0" font-size="22" font-weight="600" fill="#805616">Provider control does not synthesize arbitrary ACP messages</text><text x="86" y="642.0" font-size="17" font-weight="400" fill="#45576b">Negotiate and exercise the real lifecycle. A directly scripted ACP peer would be a separate capability.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb"/><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">01 / 14</text></g></svg>