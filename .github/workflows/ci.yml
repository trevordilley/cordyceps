name: CI

on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.3', '24.15.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests
      - run: bun run test:node
      - run: bun run build
      - name: Verify and retain the installed package
        run: node scripts/verify-package.mjs --pack-destination artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-node-${{ matrix.node }}
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  consumers:
    name: Real consumers / ${{ matrix.group }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [baseline, extra-cli, pi, vendors, source-clis, codebuff-polygraph, providers, google, editors, auggie, openclaw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Install and exercise authentic consumers
        run: bash scripts/ci-real-consumers.sh "$CONSUMER_GROUP"
        env:
          CONSUMER_GROUP: ${{ matrix.group }}
      - name: Upload actual consumer receipts, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-${{ matrix.group }}
          path: ${{ runner.temp }}/cordyceps-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
