<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Describe injection settings as data</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 02</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Describe injection settings as data</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Fictional my-harness.json excerpt: no executable discovery or version policy.</text><g id="manifest"><title>MANIFEST EXCERPT</title><desc>Proposed Cordyceps definition, shown as a JavaScript object; save its data as JSON in your definition file. Proposed example; not implemented.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">MANIFEST EXCERPT</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const definition = {</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  schemaVersion: 1, id: 'my-harness',</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  provider: {</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    adapter: 'anthropic-messages',</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    override: {</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      env: {</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">        MY_HARNESS_API_URL: '${mock.baseUrl}',</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">        MY_HARNESS_API_KEY: '${mock.apiKey}',</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      },</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      unsetEnv: ['MY_HARNESS_PROFILE'],</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    },</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  },</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  modes: {</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    interactive: { args: [] },</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    nonInteractive: { args: ['--print'] },</text><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    acp: { args: ['--acp'] },</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  },</text><text x="66" y="545.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">};</text></g><g id="validation"><title>Validate the file</title><desc>Check field types, known tokens, provider codec and requested recipe. No version probe, executable lookup or shell inspection.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Validate the file</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Check field types, known tokens, provider</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">codec and requested recipe. No version</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">probe, executable lookup or shell</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">inspection.</text></g><g id="versions"><title>Schema format only</title><desc>schemaVersion identifies the JSON format. There are no binary version ranges, OS support tables or automatic compatibility selectors.</desc><text x="842" y="344.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Schema format only</text><text x="842" y="379.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">schemaVersion identifies the JSON format.</text><text x="842" y="403.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">There are no binary version ranges, OS</text><text x="842" y="427.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">support tables or automatic compatibility</text><text x="842" y="451.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">selectors.</text></g><g id="negotiation"><title>ACP belongs to the client</title><desc>The consumer’s client negotiates with its real process. Selecting an ACP recipe only supplies settings; it does not assert protocol capabilities.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">ACP belongs to the client</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">The consumer’s client negotiates with its</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">real process. Selecting an ACP recipe only</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">supplies settings; it does not assert</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">protocol capabilities.</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Proposed Cordyceps definition, shown as a JavaScript object; save its data as JSON in your definition file.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">02 / 13</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">MY_HARNESS_* and flags are fictional. ${...} values are Cordyceps substitution tokens. Format not implemented.</text></svg>