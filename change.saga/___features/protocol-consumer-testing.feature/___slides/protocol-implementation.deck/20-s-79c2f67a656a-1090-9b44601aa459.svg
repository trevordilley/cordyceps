<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Stage 5: a tool has its own lifecycle</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 10</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Stage 5: a tool has its own lifecycle</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Precondition: tool-capable scenario. Model response requests a real fixture-file read.</text><g id="tool"><title>ASSERT YOUR CONSUMER’S TOOL MODEL</title><desc>Yours: client API, sessionId and offeredId from real setup/permission options. Playwright: expect. Illustrative consumer example; not executed.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">ASSERT YOUR CONSUMER’S TOOL MODEL</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Provider scenario: request Read(fixturePath),</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// inspect the real tool result, then reply "Read done".</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const turn = client.request('session/prompt', {</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  sessionId,</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  prompt: [{ type: 'text', text: 'Read the fixture' }],</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await expect.poll(() =&gt; client.tools(sessionId).length)</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  .toBeGreaterThan(0);</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const toolId = client.tools(sessionId)[0].toolCallId;</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await expect.poll(() =&gt; client.tool(sessionId, toolId).status)</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  .toBe('completed');</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">expect(client.tool(sessionId, toolId).title).toBeTruthy();</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// A partial status update must not erase prior title.</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">expect((await turn).stopReason).toBe('end_turn');</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Separate permission test: select an offered option.</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Respond to session/request_permission with:</text><text x="66" y="545.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const permissionResult = {</text><text x="66" y="565.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  outcome: { outcome: 'selected', optionId: offeredId },</text><text x="66" y="585.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">};</text></g><g id="states"><title>Observe what the agent emits</title><desc>pending → in_progress → completed or failed. Not every intermediate status is guaranteed. Merge partial tool_call_update fields into the identified tool.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Observe what the agent emits</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">pending → in_progress → completed or</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">failed. Not every intermediate status is</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">guaranteed. Merge partial tool_call_update</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">fields into the identified tool.</text></g><g id="permissions"><title>Separate test branches</title><desc>Allowed read: assert real file content. Denied read: assert the consumer’s refusal path. Pending permission: assert the UI and resolve the actual request ID.</desc><text x="842" y="345.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Separate test branches</text><text x="842" y="380.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Allowed read: assert real file content.</text><text x="842" y="404.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Denied read: assert the consumer’s refusal</text><text x="842" y="428.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">path. Pending permission: assert the UI</text><text x="842" y="452.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">and resolve the actual request ID.</text></g><g id="handlers"><title>Do not bypass your handlers</title><desc>Some integrations use client filesystem/terminal callbacks. Advertise and test those real handlers. A mock provider response must not manufacture the file-read result.</desc><text x="842" y="505.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#805616" xml:space="preserve">Do not bypass your handlers</text><text x="842" y="540.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Some integrations use client</text><text x="842" y="564.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">filesystem/terminal callbacks. Advertise</text><text x="842" y="588.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">and test those real handlers. A mock</text><text x="842" y="612.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">provider response must not manufacture the</text><text x="842" y="637.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">file-read result.</text></g><a href="https://agentclientprotocol.com/protocol/v1/tool-calls" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / tool-calls</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Yours: client API, sessionId and offeredId from real setup/permission options. Playwright: expect.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">10 / 14</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">ACP: method names, tool fields and permission result. Consumer accessors are illustrative; test not executed.</text></svg>