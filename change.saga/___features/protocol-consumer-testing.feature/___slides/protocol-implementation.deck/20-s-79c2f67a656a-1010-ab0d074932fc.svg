<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Test lifetimes independently</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 02</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Test lifetimes independently</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">A connection can contain many sessions; a session can survive many completed prompt turns.</text><g id="connection"><title>Process + ACP connection</title><desc>Launch → negotiate → ready → disconnect Assert real executable, version, capabilities, transport errors</desc><rect x="48" y="162" width="1184" height="95" rx="12" fill="#e0f4f0" stroke="#a9c3ca"/><text x="68" y="194.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Process + ACP connection</text><text x="68" y="227.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Launch → negotiate → ready → disconnect</text><text x="68" y="251.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Assert real executable, version, capabilities, transport errors</text></g><g id="session"><title>Session A</title><desc>session/new → ready Prompt 1 → complete Prompt 2 → cancelled Session remains addressable</desc><rect x="75" y="280" width="470" height="205" rx="12" fill="#f2f5f8" stroke="#a9c3ca"/><text x="95" y="312.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Session A</text><text x="95" y="345.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">session/new → ready</text><text x="95" y="369.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Prompt 1 → complete</text><text x="95" y="393.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Prompt 2 → cancelled</text><text x="95" y="417.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Session remains addressable</text></g><g id="session-b"><title>Session B</title><desc>Different sessionId + context Assert messages route to B A must not receive B’s output Concurrency support is adapter-specific</desc><rect x="575" y="280" width="630" height="205" rx="12" fill="#f2f5f8" stroke="#a9c3ca"/><text x="595" y="312.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Session B</text><text x="595" y="345.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Different sessionId + context</text><text x="595" y="369.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Assert messages route to B</text><text x="595" y="393.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">A must not receive B’s output</text><text x="595" y="417.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Concurrency support is adapter-specific</text></g><g id="messages"><title>Inside a turn: messages</title><desc>Chunks accumulate; optional messageId groups them A chunk is not a finished turn</desc><rect x="75" y="512" width="545" height="123" rx="12" fill="#e0f4f0" stroke="#a9c3ca"/><text x="95" y="544.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Inside a turn: messages</text><text x="95" y="577.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Chunks accumulate; optional messageId groups them</text><text x="95" y="601.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">A chunk is not a finished turn</text></g><g id="tools"><title>Inside a turn: tool calls</title><desc>Track toolCallId and partial updates Permissions can require client replies</desc><rect x="650" y="512" width="555" height="123" rx="12" fill="#e0f4f0" stroke="#a9c3ca"/><text x="670" y="544.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Inside a turn: tool calls</text><text x="670" y="577.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Track toolCallId and partial updates</text><text x="670" y="601.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Permissions can require client replies</text></g><a href="https://agentclientprotocol.com/protocol/v1/prompt-turn" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / prompt-turn</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed design + illustrative tests · ACP v1 examples · no ACP integration verified yet</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">02 / 14</text></svg>