<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Three injection outputs, one mock</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097" /></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097" /></marker></defs><rect width="1280" height="720" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  03</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Three injection outputs, one mock</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">The app applies these values through its existing configuration and process setup.</text><g id="env"><title>environment(baseEnv)</title><desc>One of the environment, argument or generated-file injection surfaces applied by the consuming app; no required launcher or binary resolver.</desc><rect x="64" y="215" width="360" height="260" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5" /><text x="86" y="250.0" font-size="22" font-weight="600" fill="#105d53">environment(baseEnv)</text><text x="86" y="282.0" font-size="17" font-weight="400" fill="#45576b">App inherits provider settings</text><text x="86" y="305.8" font-size="17" font-weight="400" fill="#45576b">Works with absolute binaries</text><text x="86" y="329.6" font-size="17" font-weight="400" fill="#45576b">Preserves normal discovery</text><text x="86" y="353.4" font-size="17" font-weight="400" fill="#45576b">Pure merge; no shell handling</text></g><g id="path"><title>args</title><desc>One of the environment, argument or generated-file injection surfaces applied by the consuming app; no required launcher or binary resolver.</desc><rect x="460" y="215" width="360" height="260" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="482" y="250.0" font-size="22" font-weight="600" fill="#23364b">args</text><text x="482" y="282.0" font-size="17" font-weight="400" fill="#45576b">Additional recipe arguments</text><text x="482" y="305.8" font-size="17" font-weight="400" fill="#45576b">App chooses its own command</text><text x="482" y="329.6" font-size="17" font-weight="400" fill="#45576b">No executable is selected</text><text x="482" y="353.4" font-size="17" font-weight="400" fill="#45576b">No binary version checks</text></g><g id="explicit"><title>configFiles</title><desc>One of the environment, argument or generated-file injection surfaces applied by the consuming app; no required launcher or binary resolver.</desc><rect x="856" y="215" width="360" height="260" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="878" y="250.0" font-size="22" font-weight="600" fill="#23364b">configFiles</text><text x="878" y="282.0" font-size="17" font-weight="400" fill="#45576b">Optional generated JSON/TOML</text><text x="878" y="305.8" font-size="17" font-weight="400" fill="#45576b">Paths substituted into settings</text><text x="878" y="329.6" font-size="17" font-weight="400" fill="#45576b">Owned by the mock session</text><text x="878" y="353.4" font-size="17" font-weight="400" fill="#45576b">No user config is rewritten</text></g><g id="symlink"><title>The app remains responsible for invocation</title><desc>One of the environment, argument or generated-file injection surfaces applied by the consuming app; no required launcher or binary resolver.</desc><rect x="64" y="550" width="1152" height="95" rx="14" fill="#fff2d6" stroke="#d49d3e" stroke-width="1.5" /><text x="86" y="585.0" font-size="22" font-weight="600" fill="#805616">The app remains responsible for invocation</text><text x="86" y="617.0" font-size="17" font-weight="400" fill="#45576b">Cordyceps supplies values; it does not require a wrapper, native launcher or PATH rewrite.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb" /><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">03 / 13</text></g></svg>