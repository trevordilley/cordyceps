<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Verify the library’s own contracts</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097" /></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097" /></marker></defs><rect width="1280" height="720" fill="#ffffff" /><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  13</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Verify the library’s own contracts</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">Library tests use settings and synthetic provider traffic; consumer E2E tests own binary behavior.</text><g id="gate-one"><title>1  Injection data</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="64" y="280" width="330" height="190" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5" /><text x="86" y="315.0" font-size="22" font-weight="600" fill="#105d53">1  Injection data</text><text x="86" y="347.0" font-size="17" font-weight="400" fill="#45576b">Registry and recipe selection</text><text x="86" y="370.8" font-size="17" font-weight="400" fill="#45576b">Environment and config output</text><text x="86" y="394.6" font-size="17" font-weight="400" fill="#45576b">No executable probes</text></g><g id="gate-two"><title>2  Provider codec</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="475" y="280" width="330" height="190" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="497" y="315.0" font-size="22" font-weight="600" fill="#23364b">2  Provider codec</text><text x="497" y="347.0" font-size="17" font-weight="400" fill="#45576b">Synthetic request fixtures</text><text x="497" y="370.8" font-size="17" font-weight="400" fill="#45576b">Text, tool and stream encoding</text><text x="497" y="394.6" font-size="17" font-weight="400" fill="#45576b">Scripted errors and aborts</text></g><g id="gate-three"><title>3  Mock lifecycle</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="886" y="280" width="330" height="190" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5" /><text x="908" y="315.0" font-size="22" font-weight="600" fill="#23364b">3  Mock lifecycle</text><text x="908" y="347.0" font-size="17" font-weight="400" fill="#45576b">Parallel mock isolation</text><text x="908" y="370.8" font-size="17" font-weight="400" fill="#45576b">Rollback and cleanup</text><text x="908" y="394.6" font-size="17" font-weight="400" fill="#45576b">Standalone + Playwright fixtures</text></g><g id="gate-one-two"><title>prove core</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="389" y="370" width="91" height="10" fill="transparent" /><path d="M394,375 L475,375" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" /></g><g id="gate-two-three"><title>prove integration</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="800" y="370" width="91" height="10" fill="transparent" /><path d="M805,375 L886,375" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)" /></g><g id="known-evidence"><title>Real-binary tests belong to the consumer</title><desc>Library-level tests exercise configuration rendering, provider codecs and mock lifecycle. Real-binary E2E scenarios belong to consumers.</desc><rect x="64" y="515" width="1152" height="110" rx="14" fill="#fff2d6" stroke="#d49d3e" stroke-width="1.5" /><text x="86" y="550.0" font-size="22" font-weight="600" fill="#805616">Real-binary tests belong to the consumer</text><text x="86" y="582.0" font-size="17" font-weight="400" fill="#45576b">Earlier shell and binary experiments are historical findings, not a certification or version matrix.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb" /><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">13 / 13</text></g></svg>