<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Stage 1: negotiate before creating a session</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 04</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Stage 1: negotiate before creating a session</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Precondition: process is running and transport is connected. No conversation exists yet.</text><g id="initialize"><title>CONSUMER TEST — NATIVE ACP PARAMS</title><desc>Yours: client API and fixtureDirectory. Node: assert. ACP: initialize / session/new methods and native payloads. Illustrative consumer example; not executed.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">CONSUMER TEST — NATIVE ACP PARAMS</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const init = await client.request('initialize', {</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  protocolVersion: 1,</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  clientCapabilities: {},</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  clientInfo: { name: 'my-client-test', version: '1' },</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.equal(init.protocolVersion, 1);</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.equal(client.state, 'ready');</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Authenticate through the client if required.</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Do not assume the agent returns authMethods: [].</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const { sessionId } = await client.request('session/new', {</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  cwd: fixtureDirectory, mcpServers: [],</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.equal(typeof sessionId, 'string');</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.ok(sessionId.length &gt; 0);</text></g><g id="arrange"><title>Arrange</title><desc>Use an absolute fixture directory. Empty clientCapabilities deliberately does not advertise filesystem or terminal handlers.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Arrange</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Use an absolute fixture directory. Empty</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">clientCapabilities deliberately does not</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">advertise filesystem or terminal handlers.</text></g><g id="assert"><title>Assert</title><desc>Check the negotiated version and actual advertised capabilities. Verify your client becomes ready and stores the returned session identity.</desc><text x="842" y="340.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Assert</text><text x="842" y="375.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Check the negotiated version and actual</text><text x="842" y="399.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">advertised capabilities. Verify your</text><text x="842" y="423.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">client becomes ready and stores the</text><text x="842" y="447.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">returned session identity.</text></g><g id="boundary"><title>What this does not prove</title><desc>A ready connection is not evidence that provider routing works. The next stage must produce a real model request. Auth failure and version mismatch need separate scenarios.</desc><text x="842" y="500.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#805616" xml:space="preserve">What this does not prove</text><text x="842" y="535.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">A ready connection is not evidence that</text><text x="842" y="559.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">provider routing works. The next stage</text><text x="842" y="583.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">must produce a real model request. Auth</text><text x="842" y="607.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">failure and version mismatch need separate</text><text x="842" y="632.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">scenarios.</text></g><a href="https://agentclientprotocol.com/protocol/v1/initialization" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / initialization</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Yours: client API and fixtureDirectory. Node: assert. ACP: initialize / session/new methods and native payloads.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">04 / 14</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">client.state is your application’s state model, not an ACP field or Cordyceps API. Illustrative test; not executed.</text></svg>