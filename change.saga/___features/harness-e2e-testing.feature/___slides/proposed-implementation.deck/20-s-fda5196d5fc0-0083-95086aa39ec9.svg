<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Standalone: run the real binary from a script</title><rect width="1280" height="720" fill="white" /><text x="48" y="35" font-family="Arial" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / PROPOSED USAGE / 11</text><text x="48" y="81" font-family="Arial" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Standalone: run the real binary from a script</text><text x="48" y="114" font-family="Arial" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">The same route and environment API works without Playwright or a browser.</text><g id="sample"><title>Proposed code sample</title><rect x="48" y="143" width="835" height="505" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="169" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { cordyceps } from 'cordyceps';</text><text x="66" y="189" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { execFile } from 'node:child_process';</text><text x="66" y="209" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { promisify } from 'node:util';</text><text x="66" y="229" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import assert from 'node:assert/strict';</text><text x="66" y="249" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="269" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const run = promisify(execFile);</text><text x="66" y="289" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const ai = await cordyceps.prepare({ harness: 'claude-code' });</text><text x="66" y="309" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">try {</text><text x="66" y="329" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  await ai.route(() =&gt; true, route =&gt;</text><text x="66" y="349" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    route.fulfill({ text: 'Hello from the test' }));</text><text x="66" y="369" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  const { stdout } = await run('claude', ['-p', 'Say hello'], {</text><text x="66" y="389" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    env: ai.environment(process.env),</text><text x="66" y="409" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    timeout: 15_000, maxBuffer: 1024 * 1024,</text><text x="66" y="429" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  });</text><text x="66" y="449" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  assert.match(stdout, /Hello from the test/);</text><text x="66" y="469" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  assert.ok(ai.requests.some(r =&gt; r.text.includes('Say hello')));</text><text x="66" y="489" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  console.log(ai.requests.map(r =&gt; r.raw.body));</text><text x="66" y="509" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">} finally {</text><text x="66" y="529" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  await ai.dispose();</text><text x="66" y="549" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">}</text><desc>Cordyceps (proposed): cordyceps + ai + route. Node: execFile, promisify, assert, process. Proposed example; not implemented.</desc></g><g id="note-0"><text x="913" y="164" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Normal process API</text><text x="913" y="194" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">execFile runs installed Claude.</text><text x="913" y="217" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Use an absolute installed path</text><text x="913" y="240" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">when normal discovery needs it.</text></g><g id="note-1"><text x="913" y="319" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Same control surface</text><text x="913" y="349" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">route + fulfill prescribe output.</text><text x="913" y="372" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">requests exposes the recorded</text><text x="913" y="395" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">provider transcript.</text></g><g id="note-2"><text x="913" y="474" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Explicit ownership</text><text x="913" y="504" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Await process completion, then</text><text x="913" y="527" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">dispose the mock session.</text><text x="913" y="550" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">This example is non-interactive.</text></g><text x="48" y="687" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): cordyceps + ai + route. Node: execFile, promisify, assert, process.</text><text x="1160" y="689" font-family="Arial" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">11 / 13</text><text x="48" y="705" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">run is locally defined from Node’s execFile. Yours: command, arguments and assertions. API sketch; not implemented.</text></svg>