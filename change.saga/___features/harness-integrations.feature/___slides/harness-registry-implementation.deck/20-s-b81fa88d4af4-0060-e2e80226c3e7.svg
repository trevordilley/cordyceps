<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Return values the app can inject</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 07</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Return values the app can inject</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Environment, additional argv values and optional config artifacts are the integration surface.</text><g id="plan"><title>PROPOSED INJECTION OUTPUTS</title><desc>Cordyceps (proposed): ai.environment, ai.args, ai.configFiles. Yours: startMyApp and myAppBaseEnv. Proposed example; not implemented.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">PROPOSED INJECTION OUTPUTS</text><text x="66" y="205" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { startMyApp } from './your-test-helpers';</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const env = ai.environment(myAppBaseEnv);</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const extraArgs = ai.args;</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const files = ai.configFiles;</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Consumer code applies these through its normal seam.</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const app = await startMyApp({ env, extraHarnessArgs: extraArgs });</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// These outputs contain no selected executable,</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// executable version, version range or shell adapter.</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// The library does not replace the app's command.</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Additional config paths are already substituted</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// into declared env/args where the recipe needs them.</text></g><g id="separation"><title>Settings are not proof</title><desc>Successful preparation means the mock and its injection values are ready. The consumer decides which traffic and frontend behavior to assert.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Settings are not proof</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Successful preparation means the mock and</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">its injection values are ready. The</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">consumer decides which traffic and</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">frontend behavior to assert.</text></g><g id="surfaces"><title>Your helper, not Cordyceps</title><desc>startMyApp is imported from your test helpers. Its name, options and returned app are illustrative consumer code. Cordyceps supplies only the mock and injection values.</desc><text x="842" y="344.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Your helper, not Cordyceps</text><text x="842" y="379.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">startMyApp is imported from your test</text><text x="842" y="403.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">helpers. Its name, options and returned</text><text x="842" y="427.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">app are illustrative consumer code.</text><text x="842" y="451.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps supplies only the mock and</text><text x="842" y="476.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">injection values.</text></g><g id="isolation"><title>Leave global state alone</title><desc>environment(baseEnv) is a pure merge. Parallel tests own separate mocks and generated files; no global process.env swapping.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Leave global state alone</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">environment(baseEnv) is a pure merge.</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Parallel tests own separate mocks and</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">generated files; no global process.env</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">swapping.</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): ai.environment, ai.args, ai.configFiles. Yours: startMyApp and myAppBaseEnv.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">07 / 13</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">env / extraArgs / files are local variables. Helper options belong to your app. API sketch; not implemented.</text></svg>