<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Generate configuration around the process</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 05</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Generate configuration around the process</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">A recipe may write isolated JSON or TOML and expose its path through environment or arguments.</text><g id="config"><title>PROPOSED OVERRIDE FRAGMENT</title><desc>Proposed Cordyceps override data, shown as a JavaScript object. MY_HARNESS_* and config keys are fictional. Proposed example; not implemented.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">PROPOSED OVERRIDE FRAGMENT</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const override = {</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  configFiles: [{</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    id: 'provider', format: 'toml', path: 'config.toml',</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    values: { provider: 'cordyceps',</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      providers: { cordyceps: {</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">        base_url: '${mock.baseUrl}',</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">        api_key: '${mock.apiKey}',</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">      } },</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    },</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }],</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  env: { MY_HARNESS_CONFIG: '${config.provider.path}' },</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  unsetEnv: ['MY_HARNESS_PROFILE'],</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">};</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// ai.environment(baseEnv) returns a new object.</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Apply declared removals, then the recipe's overrides.</text><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// ai.configFiles exposes generated paths and ownership.</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// No user config or startup file is modified.</text></g><g id="tokens"><title>Small token vocabulary</title><desc>Use mock.baseUrl, mock.apiKey, session.dir, config.&lt;id&gt;.path and explicit input.&lt;name&gt; values. No shell evaluation or executable expressions.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Small token vocabulary</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Use mock.baseUrl, mock.apiKey,</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">session.dir, config.&lt;id&gt;.path and explicit</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">input.&lt;name&gt; values. No shell evaluation</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">or executable expressions.</text></g><g id="precedence"><title>Pure data transformation</title><desc>Structured serializers own quoting. Environment merging leaves the input unchanged. Reject conflicting recipe fields; do not inspect arbitrary app flags.</desc><text x="842" y="344.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Pure data transformation</text><text x="842" y="379.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Structured serializers own quoting.</text><text x="842" y="403.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Environment merging leaves the input</text><text x="842" y="427.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">unchanged. Reject conflicting recipe</text><text x="842" y="451.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">fields; do not inspect arbitrary app</text><text x="842" y="476.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">flags.</text></g><g id="shells"><title>No shell knowledge</title><desc>The app applies the returned settings through its existing setup. Cordyceps never loads, forwards, patches or models .zshrc and other startup files.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">No shell knowledge</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">The app applies the returned settings</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">through its existing setup. Cordyceps</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">never loads, forwards, patches or models</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">.zshrc and other startup files.</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Proposed Cordyceps override data, shown as a JavaScript object. MY_HARNESS_* and config keys are fictional.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">05 / 13</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps substitutes ${...} tokens and returns ai values. baseEnv is caller-owned input. Format not implemented.</text></svg>