<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Supply injection; the app owns its binary</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 01</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Supply injection; the app owns its binary</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps prepares mock-provider settings around the consumer’s existing process integration.</text><g id="row-0"><title>Definition + registry</title><desc>Local or bundled JSON supplies settings Same data contract; no binary inspection</desc><rect x="48" y="165" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="190.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Definition + registry</text><text x="315" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Local or bundled JSON supplies settings</text><text x="766" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Same data contract; no binary inspection</text></g><g id="row-1"><title>Injection rendering</title><desc>Mock endpoint + recipe + caller inputs Return env, extra args and optional config files</desc><rect x="48" y="249" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="274.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Injection rendering</text><text x="315" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Mock endpo