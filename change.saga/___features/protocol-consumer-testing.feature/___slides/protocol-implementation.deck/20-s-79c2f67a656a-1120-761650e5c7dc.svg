<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Stage 8: inject failure at the right boundary</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 13</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Stage 8: inject failure at the right boundary</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">A provider error, a protocol error and a disconnected process exercise different code paths.</text><g id="failure-0"><title>Launch / transport</title><desc>Bad executable; kill owned agent. Assert: Client rejects pending calls; exposes disconnect. Control: Process fixture.</desc><rect x="48" y="175" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="64" y="200.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Launch / transport</text><text x="255" y="200.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Bad executable; kill owned agent</text><text x="605" y="200.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Client rejects pending calls;</text><text x="605" y="221.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">exposes disconnect</text><text x="958" y="200.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Process fixture</text></g><g id="failure-1"><title>Negotiation</title><desc>Incompatible version or auth result. Assert: Client never presents a ready session. Control: Real supported case or mock peer.</desc><rect x="48" y="261" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="64" y="286.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Negotiation</text><text x="255" y="286.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Incompatible version or auth result</text><text x="605" y="286.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Client never presents a ready</text><text x="605" y="307.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">session</text><text x="958" y="286.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Real supported case or</text><text x="958" y="307.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">mock peer</text></g><g id="failure-2"><title>Model request</title><desc>Provider HTTP error or broken stream. Assert: Observe actual retry/error mapping; bound waits. Control: Provider adapter.</desc><rect x="48" y="347" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="64" y="372.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Model request</text><text x="255" y="372.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Provider HTTP error or broken stream</text><text x="605" y="372.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Observe actual retry/error mapping;</text><text x="605" y="393.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">bound waits</text><text x="958" y="372.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Provider adapter</text></g><g id="failure-3"><title>ACP parser</title><desc>Malformed frame; invalid result shape. Assert: Parser rejects it without corrupting state. Control: Separate mock peer / fault injector.</desc><rect x="48" y="433" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="64" y="458.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">ACP parser</text><text x="255" y="458.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Malformed frame; invalid result</text><text x="255" y="479.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">shape</text><text x="605" y="458.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Parser rejects it without corrupting</text><text x="605" y="479.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">state</text><text x="958" y="458.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Separate mock peer / fault</text><text x="958" y="479.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">injector</text></g><g id="failure-4"><title>Teardown</title><desc>Fail assertion during held request. Assert: Client + child processes stop; backend closes. Control: Fixture cleanup.</desc><rect x="48" y="519" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="64" y="544.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Teardown</text><text x="255" y="544.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Fail assertion during held request</text><text x="605" y="544.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Client + child processes stop;</text><text x="605" y="565.6" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">backend closes</text><text x="958" y="544.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Fixture cleanup</text></g><a href="https://agentclientprotocol.com/protocol/v1/prompt-turn" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / prompt-turn</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed design + illustrative tests · ACP v1 examples · no ACP integration verified yet</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">13 / 14</text></svg>