<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Force a real tool round trip</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 09</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Force a real tool round trip</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Provider-side setup for the next slide: request a read, inspect its real result, then finish the turn.</text><g id="provider-script"><title>PROPOSED PROVIDER SCENARIO</title><desc>Cordyceps (proposed): ai + route + parsed tool views. Node: assert. Yours: fixturePath and fixture file. Illustrative consumer example; not executed.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">PROPOSED PROVIDER SCENARIO</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await ai.route(() =&gt; true, async route =&gt; {</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  const result = route.request.toolResults.find(</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    r =&gt; r.id === 'read-fixture');</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  if (result) {</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    assert.ok(!result.isError);</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    assert.ok(result.text.includes('fixture contents'));</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    return route.fulfill({ text: 'Read done' });</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  assert.ok(route.request.tools.some(t =&gt; t.name === 'Read'));</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  return route.fulfill({ toolCall: {</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    id: 'read-fixture', name: 'Read',</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    input: { file_path: fixturePath },</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  } });</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// fixturePath is an absolute path to a disposable file.</text><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Its content was written by test setup, not the mock.</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// The real agent executes the read and submits its result.</text><text x="66" y="545.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// A bounded turn wait fails if no result arrives.</text></g><g id="setup"><title>Arrange the real read</title><desc>Create a fixture containing "fixture contents". Use the harness’s actual permission path. Read and file_path are version-specific tool names and arguments.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Arrange the real read</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Create a fixture containing "fixture</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">contents". Use the harness’s actual</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">permission path. Read and file_path are</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">version-specific tool names and arguments.</text></g><g id="roundtrip"><title>Observe two model requests</title><desc>First request: return tool-call semantics. Follow-up request: assert the real file content before sending final text. Additional retries or requests remain observable.</desc><text x="842" y="344.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Observe two model requests</text><text x="842" y="379.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">First request: return tool-call semantics.</text><text x="842" y="403.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Follow-up request: assert the real file</text><text x="842" y="427.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">content before sending final text.</text><text x="842" y="451.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Additional retries or requests remain</text><text x="842" y="476.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">observable.</text></g><g id="identity"><title>Keep IDs at their boundary</title><desc>tools and toolResults are proposed adapter views. Do not assume ACP toolCallId equals the provider call ID; assert the actual ACP identity on the client side.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#805616" xml:space="preserve">Keep IDs at their boundary</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">tools and toolResults are proposed adapter</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">views. Do not assume ACP toolCallId equals</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">the provider call ID; assert the actual</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">ACP identity on the client side.</text></g><a href="https://agentclientprotocol.com/protocol/v1/tool-calls" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / tool-calls</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): ai + route + parsed tool views. Node: assert. Yours: fixturePath and fixture file.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">09 / 14</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Read / file_path are harness tool semantics, not ACP or Cordyceps method names. Illustrative test; not executed.</text></svg>