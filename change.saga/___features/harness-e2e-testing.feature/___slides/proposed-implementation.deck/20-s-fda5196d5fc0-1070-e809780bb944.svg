<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img" aria-labelledby="slide-title"><title id="slide-title">Make ownership and teardown explicit</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#6b8097"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8Z" fill="#6b8097"/></marker></defs><rect width="1280" height="720" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="43.0" font-size="13" font-weight="600" fill="#137568">CORDYCEPS  /  PROPOSED IMPLEMENTATION  /  08</text><text x="64" y="93.0" font-size="34" font-weight="600" fill="#182c40">Make ownership and teardown explicit</text><text x="64" y="131.0" font-size="18" font-weight="400" fill="#45576b">The Playwright fixture and standalone API share one lifecycle.</text><g id="setup"><title>Prepare</title><desc>Library: backend + config Test: handlers + launch env Register routes before app start</desc><rect x="64" y="240" width="300" height="190" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="86" y="275.0" font-size="22" font-weight="600" fill="#105d53">Prepare</text><text x="86" y="307.0" font-size="17" font-weight="400" fill="#45576b">Library: backend + config</text><text x="86" y="330.8" font-size="17" font-weight="400" fill="#45576b">Test: handlers + launch env</text><text x="86" y="354.6" font-size="17" font-weight="400" fill="#45576b">Register routes before app start</text></g><g id="active"><title>Exercise</title><desc>App owns real processes Session records provider traffic Test drives UI / assertions</desc><rect x="490" y="240" width="300" height="190" rx="14" fill="#f2f5f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="512" y="275.0" font-size="22" font-weight="600" fill="#23364b">Exercise</text><text x="512" y="307.0" font-size="17" font-weight="400" fill="#45576b">App owns real processes</text><text x="512" y="330.8" font-size="17" font-weight="400" fill="#45576b">Session records provider traffic</text><text x="512" y="354.6" font-size="17" font-weight="400" fill="#45576b">Test drives UI / assertions</text></g><g id="dispose"><title>Dispose</title><desc>Close app and its AI processes Release backend + pending waits Remove session-owned files</desc><rect x="916" y="240" width="300" height="190" rx="14" fill="#e0f4f0" stroke="#3b998a" stroke-width="1.5"/><text x="938" y="275.0" font-size="22" font-weight="600" fill="#105d53">Dispose</text><text x="938" y="307.0" font-size="17" font-weight="400" fill="#45576b">Close app and its AI processes</text><text x="938" y="330.8" font-size="17" font-weight="400" fill="#45576b">Release backend + pending waits</text><text x="938" y="354.6" font-size="17" font-weight="400" fill="#45576b">Remove session-owned files</text></g><g id="setup-active"><title>launch app</title><desc>launch app</desc><rect x="359" y="330" width="136" height="10" fill="transparent"/><path d="M364,335 L490,335" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="383" y="318.0" font-size="15" font-weight="400" fill="#45576b">launch app</text></g><g id="active-dispose"><title>finally</title><desc>finally</desc><rect x="785" y="330" width="136" height="10" fill="transparent"/><path d="M790,335 L916,335" fill="none" stroke="#6b8097" stroke-width="2.5" marker-end="url(#arrow)"/><text x="830" y="318.0" font-size="15" font-weight="400" fill="#45576b">finally</text></g><g id="isolation"><title>One isolated session per application process tree</title><desc>Do not mutate global process.env around parallel tests. Shared apps need an explicit routing contract.</desc><rect x="64" y="525" width="1152" height="110" rx="14" fill="#fff2d6" stroke="#d49d3e" stroke-width="1.5"/><text x="86" y="560.0" font-size="22" font-weight="600" fill="#805616">One isolated session per application process tree</text><text x="86" y="592.0" font-size="17" font-weight="400" fill="#45576b">Do not mutate global process.env around parallel tests. Shared apps need an explicit routing contract.</text></g><line x1="64" y1="671" x2="1216" y2="671" stroke="#dbe3eb"/><text x="64" y="698.0" font-size="13" font-weight="400" fill="#66788b">Architecture proposal · no library implementation claimed</text><text x="1135" y="698.0" font-size="13" font-weight="400" fill="#66788b">08 / 13</text></g></svg>