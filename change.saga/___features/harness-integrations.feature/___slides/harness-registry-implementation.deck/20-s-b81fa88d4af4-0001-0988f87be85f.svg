<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title" data-renderer="change-saga-diagram/2" aria-describedby="diagram-desc">
  <title id="diagram-title">Validate data before allocating resources</title>
  <desc id="diagram-desc">Local and bundled recipes share one validation and rendering path, with pure environment merging and owned files.</desc>
  <defs>
    <style>@font-face{font-family:"Change Saga Diagram";src:url("/_diagram/fonts/go-regular.ttf") format("truetype")}text{font-family:"Change Saga Diagram",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400}:root{color-scheme:light dark;--diagram-normal-fill:#ffffff;--diagram-normal-ink:#172033;--diagram-normal-stroke:#64748b;--diagram-primary-fill:#edf5ff;--diagram-primary-ink:#153869;--diagram-primary-stroke:#2563eb;--diagram-secondary-ink:#526174;--diagram-secondary-stroke:#94a3b8;--diagram-title-ink:#172033;}@media (prefers-color-scheme:dark){:root{--diagram-normal-fill:#161b22;--diagram-normal-ink:#e6edf3;--diagram-normal-stroke:#6e7681;--diagram-primary-fill:#0c2d6b;--diagram-primary-ink:#cae8ff;--diagram-primary-stroke:#4493f8;--diagram-secondary-ink:#9198a1;--diagram-secondary-stroke:#6e7681;--diagram-title-ink:#e6edf3;}}</style>
    <marker id="diagram-head-select" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-allocate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-env" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
    <marker id="diagram-head-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#94a3b8" style="fill:var(--diagram-secondary-stroke,#94a3b8)"/>
    </marker>
  </defs>
  <g id="title" data-diagram-kind="text" transform="translate(50 24)" aria-hidden="true">
    <text x="0" y="34" font-size="34" fill="#172033" xml:space="preserve" style="fill:var(--diagram-title-ink,#172033)"><tspan x="0" y="34">Validate data before allocating resources</tspan></text>
  </g>
  <g id="registry" data-diagram-kind="node" transform="translate(50 160)" role="group" aria-label="Registry snapshots">
    <path d="M0 14C0 -4.667 300 -4.667 300 14V101C300 119.667 0 119.667 0 101Z" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <path d="M0 14C0 33 300 33 300 14" fill="none" stroke="#64748b" stroke-width="2" style="stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="62" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="62">Registry snapshots</tspan></text>
    <text x="18" y="95" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="95">Bundled JSON or private file</tspan></text>
  </g>
  <g id="validate" data-diagram-kind="node" transform="translate(455 160)" role="group" aria-label="Validate selected recipe">
    <rect width="350" height="115" rx="8" fill="#edf5ff" stroke="#2563eb" stroke-width="2" style="fill:var(--diagram-primary-fill,#edf5ff);stroke:var(--diagram-primary-stroke,#2563eb)"/>
    <text x="18" y="40" font-size="22" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="40">Validate selected recipe</tspan></text>
    <text x="18" y="73" font-size="15" fill="#153869" xml:space="preserve" style="fill:var(--diagram-primary-ink,#153869)"><tspan x="18" y="73">Mode, codec, tokens, conflicts</tspan></text>
  </g>
  <g id="render" data-diagram-kind="node" transform="translate(455 420)" role="group" aria-label="Render injection">
    <rect width="350" height="115" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Render injection</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">Structured JSON / TOML</tspan></text>
  </g>
  <g id="values" data-diagram-kind="node" transform="translate(890 160)" role="group" aria-label="Environment + argv">
    <rect width="330" height="115" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="18" y="40" font-size="22" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="40">Environment + argv</tspan></text>
    <text x="18" y="73" font-size="15" fill="#172033" xml:space="preserve" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="18" y="73">Pure merge into caller base</tspan></text>
  </g>
  <g id="files" data-diagram-kind="node" transform="translate(890 420)" role="group" aria-label="Owned temporary files">
    <path d="M0 0H330V105.8C220 73.933 110 137.667 0 105.8Z" stroke-linejoin="round" fill="#ffffff" stroke="#64748b" stroke-width="2" style="fill:var(--diagram-normal-fill,#ffffff);stroke:var(--diagram-normal-stroke,#64748b)"/>
    <text x="165" y="44.175" font-size="22" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="165" y="44.175">Owned temporary files</tspan></text>
    <text x="165" y="70.675" font-size="15" fill="#172033" xml:space="preserve" text-anchor="middle" style="fill:var(--diagram-normal-ink,#172033)"><tspan x="165" y="70.675">Removed on failure / dispose</tspan></text>
  </g>
  <g id="select" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="registry to validate" data-from="registry" data-to="validate">
    <path d="M350 215 L455 215" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-select)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="allocate" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="then allocate" data-from="validate" data-to="render">
    <path d="M630 275 L630 420" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-allocate)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
    <text x="665" y="338" font-size="18" fill="#526174" xml:space="preserve" style="fill:var(--diagram-secondary-ink,#526174)"><tspan x="665" y="338">then allocate</tspan></text>
  </g>
  <g id="env" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="render to values" data-from="render" data-to="values">
    <path d="M805 440 L890 255" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-env)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
  <g id="write" data-diagram-kind="edge" transform="translate(0 0)" role="group" aria-label="render to files" data-from="render" data-to="files">
    <path d="M805 480 L890 480" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" marker-end="url(#diagram-head-write)" style="stroke:var(--diagram-secondary-stroke,#94a3b8)"/>
  </g>
</svg>
