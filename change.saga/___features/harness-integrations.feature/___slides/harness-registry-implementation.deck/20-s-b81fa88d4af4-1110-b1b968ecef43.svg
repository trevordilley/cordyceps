<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Contribute a definition, not a certification</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 12</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Contribute a definition, not a certification</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Private and bundled integrations use the same registry and injection renderer.</text><g id="row-0"><title>Author definition</title><desc>Provider codec + env/args/config recipe No binary discovery or version-probe fields</desc><rect x="48" y="165" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="190.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Author definition</text><text x="315" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Provider codec + env/args/config recipe</text><text x="766" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">No binary discovery or version-probe fields</text></g><g id="row-1"><title>Check transformation</title><desc>Fixture inputs → expected injection outputs Schema, merge and serialization tests</desc><rect x="48" y="249" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="274.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Check transformation</text><text x="315" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Fixture inputs → expected injection outputs</text><text x="766" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Schema, merge and serialization tests</text></g><g id="row-2"><title>Show usage</title><desc>Example of applying settings in a consumer app Consumer chooses whether to run real-binary E2E</desc><rect x="48" y="333" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="358.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Show usage</text><text x="315" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Example of applying settings in a consumer</text><text x="315" y="380.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">app</text><text x="766" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Consumer chooses whether to run real-binary</text><text x="766" y="380.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">E2E</text></g><g id="row-3"><title>Submit PR</title><desc>Definition + examples or focused library tests New wire format adds codec code and fixtures</desc><rect x="48" y="417" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="442.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Submit PR</text><text x="315" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Definition + examples or focused library</text><text x="315" y="464.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">tests</text><text x="766" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">New wire format adds codec code and</text><text x="766" y="464.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">fixtures</text></g><g id="row-4"><title>Bundle and release</title><desc>Select that definition by ID through the registry No harness certification or OS/version matrix</desc><rect x="48" y="501" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="526.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Bundle and release</text><text x="315" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Select that definition by ID through the</text><text x="315" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">registry</text><text x="766" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">No harness certification or OS/version</text><text x="766" y="548.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">matrix</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed implementation · illustrative APIs and fictional harness settings · not delivered</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">12 / 13</text></svg>