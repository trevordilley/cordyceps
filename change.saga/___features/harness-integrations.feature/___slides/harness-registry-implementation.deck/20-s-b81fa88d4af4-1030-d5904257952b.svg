<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Validate definitions, not installed binaries</title><rect width="1280" height="720" fill="white"/><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / HARNESS INTEGRATIONS / 04</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Validate definitions, not installed binaries</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Preparation checks data it owns. It does not inspect the consumer’s executable or environment setup.</text><g id="row-0"><title>JSON structure</title><desc>Validate IDs, fields and operation types Report definition ID and JSON field</desc><rect x="48" y="165" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="190.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">JSON structure</text><text x="315" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Validate IDs, fields and operation types</text><text x="766" y="190.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Report definition ID and JSON field</text></g><g id="row-1"><title>Provider codec</title><desc>Check the named codec exists in the library Missing codec is a configuration error</desc><rect x="48" y="249" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="274.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Provider codec</text><text x="315" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Check the named codec exists in the library</text><text x="766" y="274.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Missing codec is a configuration error</text></g><g id="row-2"><title>Explicit recipe</title><desc>Look up the consumer-selected mode No recipe: RECIPE_NOT_FOUND; no fallback</desc><rect x="48" y="333" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="358.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Explicit recipe</text><text x="315" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Look up the consumer-selected mode</text><text x="766" y="358.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">No recipe: RECIPE_NOT_FOUND; no fallback</text></g><g id="row-3"><title>Runtime values</title><desc>Check tokens and required caller inputs Unknown token or missing input fails clearly</desc><rect x="48" y="417" width="1184" height="74" rx="8" fill="#f2f5f8"/><text x="65" y="442.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Runtime values</text><text x="315" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Check tokens and required caller inputs</text><text x="766" y="442.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Unknown token or missing input fails</text><text x="766" y="464.95" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">clearly</text></g><g id="row-4"><title>Generated files</title><desc>Validate owned file targets and formats Only then start backend and render settings</desc><rect x="48" y="501" width="1184" height="74" rx="8" fill="#e0f4f0"/><text x="65" y="526.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#105d53" xml:space="preserve">Generated files</text><text x="315" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Validate owned file targets and formats</text><text x="766" y="526.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Only then start backend and render settings</text></g><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb"/><text x="48" y="695.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#805616" xml:space="preserve">Proposed implementation · illustrative APIs and fictional harness settings · not delivered</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">04 / 13</text></svg>