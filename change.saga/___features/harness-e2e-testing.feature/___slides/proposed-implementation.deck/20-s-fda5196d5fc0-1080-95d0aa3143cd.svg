<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Playwright: configure the AI fixture</title><rect width="1280" height="720" fill="white" /><text x="48" y="35" font-family="Arial" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / PROPOSED USAGE / 09</text><text x="48" y="81" font-family="Arial" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Playwright: configure the AI fixture</text><text x="48" y="114" font-family="Arial" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">One proposed test-scoped fixture owns the mock backend and its temporary configuration.</text><g id="sample"><title>Proposed code sample</title><rect x="48" y="143" width="835" height="505" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="169" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// fixtures.ts — proposed package entry point</text><text x="66" y="189" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { test, expect } from 'cordyceps/playwright';</text><text x="66" y="209" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="229" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">test.use({</text><text x="66" y="249" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  cordyceps: { harness: 'claude-code' },</text><text x="66" y="269" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="289" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="309" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">export { test, expect };</text><text x="66" y="329" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve" /><text x="66" y="349" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// The next slide imports this configured test.</text><text x="66" y="369" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Each test receives its own { ai } session.</text><text x="66" y="389" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// The consumer installs Claude Code beforehand.</text><desc>Cordyceps (proposed): test wrapper + ai fixture. Playwright: expect and test.use convention. Proposed example; not implemented.</desc></g><g id="note-0"><text x="913" y="164" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Per-test session</text><text x="913" y="194" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Proposed ai fixture prepares</text><text x="913" y="217" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">routing and temporary config,</text><text x="913" y="240" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">then disposes them after use.</text></g><g id="note-1"><text x="913" y="319" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">App stays in control</text><text x="913" y="349" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">The test launches its app.</text><text x="913" y="372" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">The app discovers and starts</text><text x="913" y="395" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">the actual installed binary.</text></g><g id="note-2"><text x="913" y="474" font-family="Arial" font-size="19" font-weight="600" fill="#105d53" xml:space="preserve">Consumer integration</text><text x="913" y="504" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">Pass ai.environment(...)</text><text x="913" y="527" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">through the app’s existing</text><text x="913" y="550" font-family="Arial" font-size="16" font-weight="400" fill="#45576b" xml:space="preserve">configuration boundary.</text></g><text x="48" y="687" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): test wrapper + ai fixture. Playwright: expect and test.use convention.</text><text x="1160" y="689" font-family="Arial" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">09 / 13</text><text x="48" y="705" font-family="Arial" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Yours: fixtures.ts configuration file and harness selection. API sketch; not implemented.</text></svg>