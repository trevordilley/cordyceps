<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Put your real client in the fixture</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 03</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Put your real client in the fixture</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Prepare routing and injection values; the consumer retains its existing ACP process setup.</text><g id="setup"><title>PROPOSED TEST FIXTURE</title><desc>Cordyceps (proposed): cordyceps + ai + route. Yours: connectClientUnderTest, exercise and client.close. Illustrative consumer example; not executed.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">PROPOSED TEST FIXTURE</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">import { connectClientUnderTest, exercise }</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  from './your-test-helpers';</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const ai = await cordyceps.prepare({</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  harness: 'claude-code',</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  mode: 'acp',</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">try {</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  await ai.route(() =&gt; true, route =&gt;</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    route.fulfill({ text: 'Hello' }));</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">  // Your app owns its process and ACP client.</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  const client = await connectClientUnderTest(ai);</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  try {</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    await exercise(client, ai);</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  } finally {</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">    await client.close(); // reap owned processes</text><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  }</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">} finally {</text><text x="66" y="545.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  await ai.dispose();</text><text x="66" y="565.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">}</text></g><g id="launch"><title>What the helper receives</title><desc>The consumer helper applies ai.environment(baseEnv), ai.args and generated files through its own process setup and chooses its own binary.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">What the helper receives</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">ai.environment(baseEnv), ai.args and files</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">for the app’s own configuration boundary.</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">It chooses and launches its own binary.</text></g><g id="helpers"><title>Your client API</title><desc>client.request, notify, onNotification and close illustrate your client facade. They are not Cordyceps exports or required ACP SDK methods. ACP defines the wire messages.</desc><text x="842" y="340.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Your client API</text><text x="842" y="375.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">client.request, notify, onNotification and</text><text x="842" y="399.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">close illustrate your client facade. They</text><text x="842" y="423.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">are not Cordyceps exports or required ACP</text><text x="842" y="447.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">SDK methods. ACP defines the wire</text><text x="842" y="472.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">messages.</text></g><g id="fixture"><title>Your test helpers</title><desc>connectClientUnderTest and exercise are imported from your test helpers. The first owns the process and client; the second runs your assertions with bounded waits.</desc><text x="842" y="508.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Your test helpers</text><text x="842" y="543.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">connectClientUnderTest and exercise are</text><text x="842" y="567.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">imported from your test helpers. The first</text><text x="842" y="591.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">owns the process and client; the second</text><text x="842" y="615.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">runs your assertions with bounded waits.</text></g><a href="https://agentclientprotocol.com/protocol/v1/prompt-turn" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / prompt-turn</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): cordyceps + ai + route. Yours: connectClientUnderTest, exercise and client.close.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">03 / 14</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Consumer helpers launch and clean up the process. No prescribed ACP SDK interface; illustrative, unexecuted test.</text></svg>