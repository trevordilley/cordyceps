<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" style="display:block" role="img"><title>Stage 2: route by session; retain context</title><rect width="1280" height="720" fill="white" /><text x="48" y="36.0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#137568" xml:space="preserve">CORDYCEPS / ACP LIFECYCLE TESTING / 05</text><text x="48" y="83.0" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#182c40" xml:space="preserve">Stage 2: route by session; retain context</text><text x="48" y="119.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#45576b" xml:space="preserve">Precondition: initialized client. Compare two independent sessions and a follow-up turn.</text><g id="sessions"><title>SEQUENTIAL ISOLATION SCENARIO</title><desc>Cordyceps (proposed): ai + route. Yours: client API and setup. Node: assert. ACP: method names and payloads. Illustrative consumer example; not executed.</desc><rect x="48" y="150" width="760" height="475" rx="12" fill="#f2f5f8" stroke="#cbd5e1" /><text x="66" y="177.0" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#137568" xml:space="preserve">SEQUENTIAL ISOLATION SCENARIO</text><text x="66" y="205.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#64748b" xml:space="preserve">// Route on scenario markers in the provider input.</text><text x="66" y="225.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await ai.route(r =&gt; r.text.includes('CASE_A'), route =&gt;</text><text x="66" y="245.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  route.fulfill({ text: 'reply-A' }));</text><text x="66" y="265.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await ai.route(r =&gt; r.text.includes('CASE_B'), route =&gt;</text><text x="66" y="285.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  route.fulfill({ text: 'reply-B' }));</text><text x="66" y="305.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const a = await client.request('session/new', setup);</text><text x="66" y="325.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">const b = await client.request('session/new', setup);</text><text x="66" y="345.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.notEqual(a.sessionId, b.sessionId);</text><text x="66" y="365.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await client.request('session/prompt', {</text><text x="66" y="385.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  sessionId: a.sessionId,</text><text x="66" y="405.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  prompt: [{ type: 'text', text: 'CASE_A' }],</text><text x="66" y="425.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="445.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">await client.request('session/prompt', {</text><text x="66" y="465.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  sessionId: b.sessionId,</text><text x="66" y="485.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">  prompt: [{ type: 'text', text: 'CASE_B' }],</text><text x="66" y="505.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">});</text><text x="66" y="525.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.equal(client.text(a.sessionId), 'reply-A');</text><text x="66" y="545.0" font-family="Menlo, monospace" font-size="17" font-weight="400" fill="#183549" xml:space="preserve">assert.equal(client.text(b.sessionId), 'reply-B');</text></g><g id="setup"><title>Arrange</title><desc>setup = { cwd: absoluteFixtureDirectory, mcpServers: [] }. Use this scenario’s routes instead of the catch-all route from the fixture example.</desc><text x="842" y="176.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Arrange</text><text x="842" y="211.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">setup = { cwd: absoluteFixtureDirectory,</text><text x="842" y="235.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">mcpServers: [] }. Use this scenario’s</text><text x="842" y="259.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">routes instead of the catch-all route from</text><text x="842" y="283.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">the fixture example.</text></g><g id="followup"><title>Add a follow-up test</title><desc>Prompt A again after its first turn completes. Assert A retains the first turn and appends the second; B remains unchanged. Do not infer context from process reuse alone.</desc><text x="842" y="341.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#105d53" xml:space="preserve">Add a follow-up test</text><text x="842" y="376.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">Prompt A again after its first turn</text><text x="842" y="400.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">completes. Assert A retains the first turn</text><text x="842" y="424.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">and appends the second; B remains</text><text x="842" y="448.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">unchanged. Do not infer context from</text><text x="842" y="473.2" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">process reuse alone.</text></g><g id="correlation"><title>Correlation boundary</title><desc>ACP sessionId need not appear in provider HTTP traffic. Marker routing is a controlled test technique, not a general session-ID mapping.</desc><text x="842" y="506.0" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#805616" xml:space="preserve">Correlation boundary</text><text x="842" y="541.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">ACP sessionId need not appear in provider</text><text x="842" y="565.3" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">HTTP traffic. Marker routing is a</text><text x="842" y="589.6" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">controlled test technique, not a general</text><text x="842" y="613.9" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576b" xml:space="preserve">session-ID mapping.</text></g><a href="https://agentclientprotocol.com/protocol/v1/session-setup" target="_blank"><text x="48" y="656.0" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#137568" xml:space="preserve">Protocol reference: ACP v1 / session-setup</text></a><line x1="48" y1="669" x2="1232" y2="669" stroke="#dbe3eb" /><text x="48" y="687" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">Cordyceps (proposed): ai + route. Yours: client API and setup. Node: assert. ACP: method names and payloads.</text><text x="1160" y="695.0" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#45576b" xml:space="preserve">05 / 14</text><text x="48" y="705" font-family="Arial, sans-serif" font-size="12.5" font-weight="400" fill="#45576b" xml:space="preserve">client.text is your consumer’s accessor; session IDs come from the real agent. Illustrative test; not executed.</text></svg>